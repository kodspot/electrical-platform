<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1E40AF">
<title>Supervisor Login — Kodspot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css?v=11">
</head>
<body class="auth-layout">
<div class="auth-card">
  <h1 class="auth-title" id="brandTitle">Kodspot</h1>
  <p class="auth-subtitle" id="brandSub">Supervisor Login</p>
  <div id="error" class="error-msg" role="alert"></div>
  <form id="loginForm">
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" type="email" id="email" required autocomplete="email" inputmode="email">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Sign in as Supervisor</button>
  </form>
  <p style="margin-top:var(--sp-md);font-size:.85rem;text-align:center">
    <a id="forgotLink" href="/reset-password" style="color:var(--primary-text);text-decoration:underline;display:inline-flex;align-items:center;min-height:44px;font-size:.875rem">Forgot password?</a>
  </p>
  <p style="margin-top:var(--sp-lg);font-size:.8rem;text-align:center">
    <a id="backLink" href="/" style="color:var(--primary-text);display:inline-flex;align-items:center;min-height:44px">&larr; Back to Home</a>
  </p>
</div>
<script src="/js/offline-sync.js?v=1"></script>
<script src="/js/kit.js?v=1"></script>
<script src="/js/app.js?v=17"></script>
<script>
var $ = App.$;
var orgSlug = App.getOrgSlug();
var mod = App.getModule();
function showErr(msg, fields) {
  $('error').textContent = msg; $('error').style.display = 'block';
  (fields || []).forEach(function(id) { $(id).setAttribute('aria-invalid', 'true'); });
}
function hideErr() {
  $('error').style.display = 'none';
  document.querySelectorAll('[aria-invalid]').forEach(function(el) { el.removeAttribute('aria-invalid'); });
}
// "Forgot password?" asks for a reset link for this organization's account. [BUG-0051]
if (orgSlug) document.getElementById('forgotLink').href = '/reset-password?org=' + encodeURIComponent(orgSlug);
if (orgSlug) { $('backLink').href = '/' + orgSlug + '/' + mod + '/'; $('backLink').textContent = '← Choose a different role'; }
Kit.revealToggle($('password'));

// Redirect if already logged in as supervisor
if (localStorage.getItem('sup_token')) location.href = App.orgPath('supervisor-scan');

// Initialise module PWA (dynamic manifest + service worker)
App.initModulePWA();

// Show org branding if accessed via org URL
if (orgSlug) {
  fetch('/api/org/' + encodeURIComponent(orgSlug)).then(function(r) { return r.ok ? r.json() : null; }).then(function(org) {
    if (org && org.name) {
      document.getElementById('brandTitle').textContent = org.name;
      document.getElementById('brandSub').innerHTML = 'Supervisor Login <span style="display:block;margin-top:.3rem;font-size:var(--fs-xs);color:var(--text-light)">Powered by Kodspot</span>';
      document.title = 'Supervisor Login \u2014 ' + org.name;
      localStorage.setItem('orgName', org.name);
    }
  }).catch(function() {});
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
  hideErr();
  try {
    var body = { email: document.getElementById('email').value.trim(), password: document.getElementById('password').value };
    if (orgSlug) body.orgSlug = orgSlug;
    var res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body) });
    var data = await res.json().catch(function() { return {}; });
    if (!res.ok) {
      showErr(Kit.signInError(res.status, 'password', data.error), ['email', 'password']);
      btn.disabled = false; btn.textContent = 'Sign in as Supervisor';
      return;
    }
    if (data.user.role !== 'SUPERVISOR') {
      showErr('Access restricted to supervisors');
      btn.disabled = false; btn.textContent = 'Sign in as Supervisor'; return;
    }
    localStorage.setItem('sup_token', data.token);
    localStorage.setItem('sup_user', JSON.stringify({ id: data.user.id, name: data.user.name, orgId: data.user.orgId }));
    var slug = data.user.orgSlug || orgSlug;
    if (slug) localStorage.setItem('orgSlug', slug);
    if (data.user.orgName) localStorage.setItem('orgName', data.user.orgName);
    if (data.user.enabledModules) localStorage.setItem('enabledModules', JSON.stringify(data.user.enabledModules));
    localStorage.setItem('activeModule', mod);
    location.href = App.orgPath('supervisor-scan');
  } catch (err) {
    showErr(Kit.friendlyError(err));
    btn.disabled = false; btn.textContent = 'Sign in as Supervisor';
  }
});
</script>
<footer class="auth-footer">
  <a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a>
</footer>
</body>
</html>
