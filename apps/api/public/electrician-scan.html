<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1E40AF">
<title>Scan QR — Electrician</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css?v=10">
<style>
.sv-shell{max-width:480px;margin:0 auto;padding:1.25rem .75rem;min-height:calc(100dvh - 56px)}
.scan-hero{text-align:center;margin-bottom:1.25rem}
.scan-hero h2{font-size:1.1rem;font-weight:700;margin-bottom:.25rem}
.scan-hero p{font-size:.78rem;color:var(--text-muted)}
#videoWrap{position:relative;width:100%;border-radius:var(--radius-lg);overflow:hidden;background:#000;margin-bottom:1rem;display:none}
#videoWrap video{width:100%;display:block}
.scan-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scan-frame{width:190px;height:190px;border:2.5px solid var(--primary);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.scan-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-size:.7rem;padding:.25rem .6rem;border-radius:var(--radius);white-space:nowrap}
.scan-start-btn{display:flex;flex-direction:column;align-items:center;gap:.6rem;background:var(--surface);border:2px dashed var(--border);border-radius:var(--radius-lg);padding:2rem 1rem;cursor:pointer;transition:border-color .15s;width:100%;text-align:center;margin-bottom:1rem}
.scan-start-btn:hover{border-color:var(--primary)}
.scan-start-icon{font-size:2.2rem;opacity:.8}
.scan-start-text{font-size:.88rem;font-weight:600;color:var(--text)}
.scan-start-sub{font-size:.72rem;color:var(--text-muted)}
.manual-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem}
.manual-section h3{font-size:.82rem;font-weight:600;margin-bottom:.6rem;color:var(--text-muted)}
.manual-row{display:flex;gap:.5rem}
.manual-row .form-input{flex:1;text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.loc-result{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.15rem;margin-top:1rem;display:none}
.loc-result.show{display:block}
.loc-result h3{font-size:1rem;font-weight:700;line-height:1.3;margin:0 0 .25rem}
.loc-result-type{font-size:.78rem;color:var(--text-muted);margin-bottom:.85rem}
.loc-badge{display:inline-block;font-size:.65rem;font-weight:700;padding:.18rem .5rem;border-radius:6px;letter-spacing:.04em;text-transform:uppercase}
.loc-badge.covered{background:rgba(16,185,129,.16);color:#34d399}
.loc-badge.not-covered{background:rgba(249,115,22,.16);color:#fb923c}
@media(max-width:480px){.sv-shell{padding:.85rem .5rem}.scan-start-btn{padding:1.5rem .75rem}}
</style>
</head>
<body>
<nav class="topbar">
  <div class="topbar-left">
    <span class="topbar-brand">Kodspot</span>
    <div class="sv-nav" id="sv-nav">
      <a href="/electrician-scan" class="sv-nav-link active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 012-2h2"/><path d="M17 3h2a2 2 0 012 2v2"/><path d="M21 17v2a2 2 0 01-2 2h-2"/><path d="M7 21H5a2 2 0 01-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>Scan</a>
      <a href="/electrician-tickets" class="sv-nav-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5H9a2 2 0 00-2 2v10a2 2 0 002 2h6a2 2 0 002-2V7a2 2 0 00-2-2z"/><path d="M12 11h.01"/><path d="M12 15h.01"/></svg>Tickets</a>
      <a href="/electrician-my-work" class="sv-nav-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>My Work</a>
    </div>
  </div>
  <div class="topbar-right">
    <span class="topbar-user" id="userName"></span>
    <button class="btn btn-sm btn-ghost" onclick="App.logoutElec()">Logout</button>
  </div>
</nav>

<div class="sv-shell">
  <div class="scan-hero">
    <h2>Scan Location QR</h2>
    <p>Point your camera at the QR code at the work site</p>
  </div>

  <div id="videoWrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="scan-overlay"><div class="scan-frame"></div></div>
    <div class="scan-hint">Position QR inside the frame</div>
  </div>
  <button class="btn btn-ghost btn-sm" id="stopBtn" onclick="stopCamera()" style="display:none;margin:0 auto .75rem;width:100%;text-align:center;font-size:.82rem">Stop Camera</button>
  <div id="cameraError" class="error-msg" style="text-align:center"></div>

  <button class="scan-start-btn" id="startBtn" onclick="startCamera()">
    <span class="scan-start-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
    <span class="scan-start-text">Tap to Open Camera</span>
    <span class="scan-start-sub">Scan location QR code</span>
  </button>

  <div class="manual-section">
    <h3>Or Enter Code Manually</h3>
    <div class="manual-row">
      <input class="form-input" type="text" id="manualCode" placeholder="e.g. ABC123" maxlength="20">
      <button class="btn btn-primary" onclick="lookupManual()">Look Up</button>
    </div>
  </div>

  <div class="loc-result" id="locationCard"></div>
</div>

<script src="/js/offline-sync.js?v=1"></script>
<script src="/js/app.js?v=16"></script>
<script>
if (!App.initElectrician()) throw '';
App.initNotifications(App.elecFetch, 'electrician');
var esc = App.esc, $ = App.$;
var videoEl = $('video'), stream = null, scanning = false;

// Can this browser read a QR code from the camera? iPhone Safari (and most desktop browsers)
// have no BarcodeDetector, or one without qr_code.
async function qrScanSupported() {
  if (!('BarcodeDetector' in window)) return false;
  try { return (await BarcodeDetector.getSupportedFormats()).indexOf('qr_code') !== -1; } catch (e) { return false; }
}

async function startCamera() {
  // Don't switch the camera on when nothing can read the code: say so, and hand the user to
  // the code field. [BUG-0022]
  if (!(await qrScanSupported())) {
    App.showError('cameraError', 'QR scanning is not supported on this browser. Please enter the code manually.');
    $('manualCode').focus();
    return;
  }
  $('startBtn').querySelector('.scan-start-text').textContent = 'Starting camera…';
  $('startBtn').style.pointerEvents = 'none';
  $('startBtn').style.opacity = '.6';
  App.hideError('cameraError');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } } });
    $('startBtn').style.display = 'none';
    $('videoWrap').style.display = 'block';
    $('stopBtn').style.display = '';
    videoEl.srcObject = stream;
    scanning = true;
    scanLoop(new BarcodeDetector({ formats: ['qr_code'] }));
  } catch (e) {
    App.showError('cameraError', 'Camera access denied. Please enter code manually.');
    $('videoWrap').style.display = 'none';
    $('startBtn').querySelector('.scan-start-text').textContent = 'Tap to Open Camera';
    $('startBtn').style.pointerEvents = '';
    $('startBtn').style.opacity = '';
    $('startBtn').style.display = '';
  }
}

async function scanLoop(detector) {
  while (scanning) {
    try {
      var barcodes = await detector.detect(videoEl);
      if (barcodes.length > 0) {
        var code = barcodes[0].rawValue;
        if (code) { scanning = false; stopCamera(); lookupCode(code); return; }
      }
    } catch(e) {}
    await new Promise(function(r) { setTimeout(r, 300); });
  }
}

function stopCamera() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
  $('videoWrap').style.display = 'none';
  $('stopBtn').style.display = 'none';
  $('startBtn').querySelector('.scan-start-text').textContent = 'Scan Again';
  $('startBtn').style.pointerEvents = '';
  $('startBtn').style.opacity = '';
  $('startBtn').style.display = '';
}

var _lookingUp = false;
function lookupManual() {
  var code = $('manualCode').value.trim();
  if (!code) return;
  lookupCode(code);
}

async function lookupCode(raw) {
  if (_lookingUp) return;
  _lookingUp = true;
  try {
    var mod = (App.getModule && App.getModule()) || localStorage.getItem('activeModule') || 'ele';
    var code = raw;
    var urlMatch = raw.match(/\/s(?:can)?\/([A-Za-z0-9]+)/i);
    if (urlMatch) code = urlMatch[1];
    code = code.toUpperCase().trim();
    $('manualCode').value = code;
    $('locationCard').classList.remove('show');
    $('locationCard').innerHTML = '<div style="text-align:center;padding:1.5rem;color:var(--text-muted);font-size:.85rem">Looking up location…</div>';
    $('locationCard').classList.add('show');
    var res = await App.elecFetch('/worker/locations/qr/' + encodeURIComponent(code) + '?module=' + encodeURIComponent(mod));
    if (!res) { $('locationCard').classList.remove('show'); return; }
    if (!res.ok) {
      App.toast('Location not found for: ' + code, 'error');
      $('locationCard').classList.remove('show');
      return;
    }
    var loc = await res.json();
    var coveredBadge = loc.isCovered
      ? '<span class="loc-badge covered">✓ Your Coverage</span>'
      : '<span class="loc-badge not-covered">⚠ Outside Your Coverage</span>';
    var openCount = loc.openTickets || 0;
    var actionsHtml = '';
    if (loc.isCovered) {
      actionsHtml = '<a href="' + App.orgPath('electrician-tickets') + '?locationId=' + loc.id + '" class="btn btn-success btn-block" style="text-decoration:none;margin-top:.6rem">📋 View Tickets at this Location (' + openCount + ' open)</a>';
    } else {
      actionsHtml = '<div style="font-size:.78rem;color:var(--text-muted);margin-top:.6rem">You can view but not pick up tickets here. Contact your supervisor for access.</div>' +
        '<a href="' + App.orgPath('electrician-tickets') + '?locationId=' + loc.id + '&view=1" class="btn btn-outline btn-block" style="text-decoration:none;margin-top:.5rem">View Open Tickets (' + openCount + ')</a>';
    }
    $('locationCard').innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;margin-bottom:.4rem">' +
        '<div><h3>' + esc(loc.name) + '</h3>' +
        '<div class="loc-result-type">' + esc(loc.type) + (loc.parent ? ' · in ' + esc(loc.parent.name) : '') + '</div></div>' +
        coveredBadge +
      '</div>' +
      actionsHtml;
  } finally {
    _lookingUp = false;
  }
}

// Auto-lookup if URL has ?code=
var urlCode = new URLSearchParams(location.search).get('code');
if (urlCode) lookupCode(urlCode);
</script>
<footer style="text-align:center;padding:.8rem;font-size:.72rem;color:var(--text-muted)">
  <a href="/privacy" style="color:var(--text-muted);text-decoration:underline">Privacy</a> · <a href="/terms" style="color:var(--text-muted);text-decoration:underline">Terms</a>
</footer>
</body>
</html>
