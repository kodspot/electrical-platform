<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<meta name="theme-color" content="#1E40AF">
<meta name="referrer" content="no-referrer">
<title>Review Resolution — Kodspot</title>
<link rel="preload" href="/css/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/design-system.css?v=12">
<script>try{if(window.matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<style>
body{background:var(--bg);min-height:100dvh}
.rv-wrap{max-width:480px;margin:0 auto;padding:1.5rem 1rem}
.rv-header{text-align:center;margin-bottom:1.5rem}
.rv-logo{font-size:1.15rem;font-weight:700;color:var(--primary);letter-spacing:-.02em}
.rv-org{font-size:.78rem;color:var(--text-muted);margin-top:.25rem}
.rv-loading,.rv-error,.rv-done{text-align:center;padding:3rem 1rem}
.rv-error{color:var(--danger-text)}

.rv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem}
.rv-card-title{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:.75rem;display:flex;align-items:center;gap:.4rem}
.rv-label{font-size:var(--fs-xs);font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:.25rem}
.rv-value{font-size:.85rem;color:var(--text);margin-bottom:.75rem}
.rv-value:last-child{margin-bottom:0}

.rv-proof-img{width:100%;max-height:300px;object-fit:cover;border-radius:var(--radius);margin-top:.5rem;cursor:pointer}
.rv-proof-img:hover{opacity:.9}

.rv-time{font-size:var(--fs-xs);color:var(--text-light);margin-top:.5rem}

.rv-actions{display:grid;gap:.75rem;margin-top:1rem}
.rv-actions .btn-confirm,.rv-actions .btn-reject,.rv-actions .btn-cancel{width:100%;min-height:48px;padding:.6rem 1rem;font:inherit;font-size:1rem;font-weight:600;border-radius:var(--radius);cursor:pointer}
.rv-actions .btn-confirm{background:var(--success);color:#fff;border:none}
.rv-actions .btn-reject{background:var(--surface);color:var(--danger-text);border:2px solid var(--danger)}
.rv-actions .btn-cancel{background:none;color:var(--text-muted);border:1px solid var(--border-control)}
.rv-actions button:disabled{opacity:.5;cursor:default}
.rv-send-error{color:var(--danger-text);font-size:.875rem;margin-top:.75rem;display:none}
.rv-proof-btn{display:block;width:100%;padding:0;border:none;background:none;cursor:zoom-in}
.rv-proof-hint{font-size:.8rem;color:var(--text-muted);margin-top:.3rem}
.rv-title{font-size:1.125rem;font-weight:700;margin:0 0 .75rem;color:var(--text);outline:none}
.fs-close{position:absolute;top:1rem;right:1rem;min-width:48px;min-height:48px;padding:0 1rem;background:#fff;color:#111;border:none;border-radius:var(--radius);font:inherit;font-weight:600;cursor:pointer}
.rv-foot{text-align:center;font-size:var(--fs-xs);color:var(--text-muted);padding:.5rem 1rem 1.25rem}

.rv-note-box{margin-top:.75rem;display:none}
.rv-note-box.show{display:block}
.rv-note-box textarea{width:100%;min-height:80px;background:var(--surface);color:var(--text);font-size:1rem;border:1px solid var(--border);border-radius:var(--radius);padding:.6rem;font-size:.82rem;resize:vertical;font-family:inherit}

.rv-timer{font-size:.85rem;color:var(--warning-text);background:var(--warning-bg);border-radius:var(--radius);padding:.45rem .75rem;text-align:center;margin-bottom:1rem;font-weight:600}

.rv-result{text-align:center;padding:2rem 1rem}
.rv-result-icon{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;margin-bottom:.75rem}
.rv-result-icon.success{background:var(--success-bg)}
.rv-result-icon.success svg{width:28px;height:28px;stroke:var(--success-text);stroke-width:2.5;fill:none}
.rv-result-icon.info{background:var(--info-bg)}
.rv-result-icon.info svg{width:28px;height:28px;stroke:var(--info-text);stroke-width:2.5;fill:none}
.rv-result-title{font-size:1.25rem;font-weight:700;color:var(--text);outline:none}
.rv-result-sub{font-size:.9rem;color:var(--text-muted);margin-top:.35rem}

.fullscreen-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:9999;align-items:center;justify-content:center;cursor:pointer}
.fullscreen-overlay.show{display:flex}
.fullscreen-overlay img{max-width:95%;max-height:95%;object-fit:contain}
</style>
</head>
<body>
<main class="rv-wrap" id="root">
  <div class="rv-loading">
    <div class="spinner" style="margin:0 auto 1rem"></div>
    <p style="color:var(--text-muted);font-size:.85rem">Loading review...</p>
  </div>
</main>
<p class="rv-foot">Kodspot · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
<div class="fullscreen-overlay" id="fsOverlay" role="dialog" aria-modal="true" aria-label="Full size photo" onclick="closePhoto()">
  <button type="button" class="fs-close" id="fsClose">Close</button>
  <img id="fsImg" src="" alt="Photo of the completed repair">
</div>
<script src="/js/kit.js?v=1"></script>
<script>
(function() {
  var root = document.getElementById('root');
  var token = window.location.pathname.split('/review/')[1];

  if (!token) {
    showError('Invalid review link.');
    return;
  }

  function render(html, title) {
    root.innerHTML = html;
    document.title = title + ' · Kodspot';
    var h = root.querySelector('h1');
    if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
    window.scrollTo(0, 0);
  }

  // Fetch review data
  fetch('/api/public/review/' + encodeURIComponent(token))
    .then(function(r) {
      if (!r.ok) return r.json().catch(function() { return {}; }).then(function(d) { throw new Error(d.error || 'This review link is invalid or has expired.'); });
      return r.json();
    })
    .then(function(data) {
      if (data.status === 'already_reviewed') {
        showAlreadyReviewed(data);
      } else if (data.status === 'expired') {
        showExpired(data);
      } else if (data.status === 'pending') {
        showReviewForm(data);
      }
    })
    .catch(function(err) {
      showError(Kit.friendlyError(err));
    });

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function timeAgo(date) {
    var s = Math.floor((Date.now() - new Date(date).getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }

  function showError(msg) {
    render(
      '<div class="rv-header"><div class="rv-logo">Kodspot</div></div>' +
      '<div class="rv-error">' +
        '<p style="font-size:1.2rem;margin-bottom:.5rem" aria-hidden="true">😕</p>' +
        '<h1 class="rv-title">' + esc(msg) + '</h1>' +
      '</div>', 'Review');
  }

  function showAlreadyReviewed(data) {
    var isConfirm = data.reviewStatus === 'CONFIRMED';
    render(
      '<div class="rv-header"><div class="rv-logo">Kodspot</div></div>' +
      '<div class="rv-result" role="status">' +
        '<div class="rv-result-icon info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>' +
        '<h1 class="rv-result-title">Already answered</h1>' +
        '<div class="rv-result-sub">You\'ve already sent your answer' +
          (data.reviewedAt ? ' (' + timeAgo(data.reviewedAt) + ')' : '') +
          '.<br>You said: <strong>' + (isConfirm ? 'it\'s fixed' : 'still a problem') + '</strong></div>' +
        '<div style="margin-top:1rem;font-size:.85rem;color:var(--text)">Thank you for your feedback!</div>' +
      '</div>', 'Already answered');
  }

  function showExpired(data) {
    render(
      '<div class="rv-header"><div class="rv-logo">Kodspot</div></div>' +
      '<div class="rv-result" role="status">' +
        '<div class="rv-result-icon info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>' +
        '<h1 class="rv-result-title">Time to answer has ended</h1>' +
        '<div class="rv-result-sub">' + esc(data.message || 'This review link has expired. The resolution has been automatically accepted.') + '</div>' +
        '<div style="margin-top:1rem;font-size:.85rem;color:var(--text)">If you still have concerns, please scan the QR code again to submit a new complaint.</div>' +
      '</div>', 'Time to answer has ended');
  }

  function showReviewForm(data) {
    var t = data.ticket;
    var imgHtml = '';
    if (t.photoUrl) { // served through the review link itself (BUG-0041)
      imgHtml = '<button type="button" class="rv-proof-btn" id="proofBtn" aria-label="Open full size photo"><img class="rv-proof-img" src="' + esc(t.photoUrl).replace(/"/g, '&quot;') + '" alt="Photo of the completed repair"></button><div class="rv-proof-hint">Tap photo to enlarge</div>';
    }

    var timerHtml = '';
    if (data.expiresAt) {
      timerHtml = '<div class="rv-timer" id="rvTimer"></div>';
    }

    render(
      '<div class="rv-header">' +
        '<div class="rv-logo">' + esc(t.orgName) + '</div>' +
      '</div>' +
      '<h1 class="rv-title" style="text-align:center">Is the problem fixed?</h1>' +
      timerHtml +
      '<div class="rv-card">' +
        '<h2 class="rv-card-title">Your complaint</h2>' +
        '<div class="rv-label">Issue</div>' +
        '<div class="rv-value">' + esc(t.title) + '</div>' +
        '<div class="rv-label">Location</div>' +
        '<div class="rv-value">' + esc(t.locationName) + '</div>' +
        '<div class="rv-time">Filed ' + timeAgo(t.createdAt) + '</div>' +
      '</div>' +
      '<div class="rv-card">' +
        '<h2 class="rv-card-title">What the team did</h2>' +
        (t.resolvedNote ? '<div class="rv-label">Note from team</div><div class="rv-value">"' + esc(t.resolvedNote) + '"</div>' : '') +
        (imgHtml ? '<div class="rv-label">Proof photo</div>' + imgHtml : '') +
        '<div class="rv-time">Resolved ' + timeAgo(t.resolvedAt) + '</div>' +
      '</div>' +
      '<div class="rv-card">' +
        '<div class="rv-note-box" id="noteBox">' +
          '<label class="form-label" for="reviewNote">What is still wrong? (optional)</label>' +
          '<textarea id="reviewNote" maxlength="500"></textarea>' +
        '</div>' +
        '<div class="rv-actions">' +
          '<button class="btn-confirm" id="btnConfirm" onclick="submitReview(\'CONFIRM\')">Yes, it\'s fixed</button>' +
          '<button class="btn-reject" id="btnReject" onclick="showRejectNote()">No, still a problem</button>' +
          '<button class="btn-cancel" id="btnCancel" hidden onclick="cancelReject()">Cancel</button>' +
        '</div>' +
        '<div class="rv-send-error" id="sendError" role="alert">Could not send your answer. Check your signal and try again.</div>' +
      '</div>', 'Is the problem fixed?');

    var proofBtn = document.getElementById('proofBtn');
    if (proofBtn) proofBtn.addEventListener('click', function() { openPhoto(proofBtn); });

    // Countdown timer
    if (data.expiresAt) {
      startTimer(new Date(data.expiresAt));
    }
  }

  function timeLeft(ms) {
    var mins = Math.ceil(ms / 60000);
    if (mins < 60) return mins + (mins === 1 ? ' minute' : ' minutes');
    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + (hours === 1 ? ' hour' : ' hours');
    var days = Math.floor(hours / 24), rest = hours % 24;
    return days + (days === 1 ? ' day' : ' days') + (rest ? ' ' + rest + (rest === 1 ? ' hour' : ' hours') : '');
  }

  function startTimer(expiresAt) {
    var el = document.getElementById('rvTimer');
    if (!el) return;
    function update() {
      var diff = expiresAt.getTime() - Date.now();
      if (diff <= 0) {
        el.textContent = 'Time to answer has ended';
        return;
      }
      el.textContent = 'You have ' + timeLeft(diff) + ' left to answer. If you do not answer, it will be marked as accepted.';
      setTimeout(update, 60000);
    }
    update();
  }

  // The full-size photo: keyboard users can open it, close it and land back where they were
  var photoOpener = null;
  function openPhoto(opener) {
    photoOpener = opener;
    document.getElementById('fsImg').src = opener.querySelector('img').src;
    document.getElementById('fsOverlay').classList.add('show');
    document.getElementById('fsClose').focus();
  }
  window.closePhoto = function() {
    document.getElementById('fsOverlay').classList.remove('show');
    if (photoOpener) photoOpener.focus();
  };
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('fsOverlay').classList.contains('show')) window.closePhoto();
  });

  // Global functions for button handlers
  window.showRejectNote = function() {
    document.getElementById('noteBox').classList.add('show');
    document.getElementById('reviewNote').focus();
    document.getElementById('btnConfirm').hidden = true;
    document.getElementById('btnCancel').hidden = false;
    // Switch reject button to actual submit
    var btn = document.getElementById('btnReject');
    btn.textContent = 'Send: still a problem';
    btn.onclick = function() { submitReview('REJECT'); };
  };

  window.cancelReject = function() {
    document.getElementById('noteBox').classList.remove('show');
    document.getElementById('btnConfirm').hidden = false;
    document.getElementById('btnCancel').hidden = true;
    var btn = document.getElementById('btnReject');
    btn.textContent = 'No, still a problem';
    btn.onclick = window.showRejectNote;
    btn.focus();
  };

  window.submitReview = function(action) {
    var btnConfirm = document.getElementById('btnConfirm');
    var btnReject = document.getElementById('btnReject');
    var noteEl = document.getElementById('reviewNote');
    var note = noteEl ? noteEl.value.trim() : '';

    // Disable buttons
    if (btnConfirm) btnConfirm.disabled = true;
    if (btnReject) btnReject.disabled = true;
    document.getElementById('sendError').style.display = 'none';

    var body = { action: action };
    if (note) body.note = note;

    fetch('/api/public/review/' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
    .then(function(r) {
      if (!r.ok) return r.json().catch(function() { return {}; }).then(function(d) { throw new Error(d.error || 'Failed'); });
      return r.json();
    })
    .then(function(result) {
      var isConfirm = action === 'CONFIRM';
      var title = isConfirm ? 'Thank you' : 'We have your answer';
      render(
        '<div class="rv-header"><div class="rv-logo">Kodspot</div></div>' +
        '<div class="rv-result" role="status">' +
          (isConfirm
            ? '<div class="rv-result-icon success"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></div>'
            : '<div class="rv-result-icon info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>') +
          '<h1 class="rv-result-title">' + title + '</h1>' +
          '<div class="rv-result-sub">' + esc(result.message) + '</div>' +
        '</div>', title);
    })
    .catch(function() {
      if (btnConfirm) btnConfirm.disabled = false;
      if (btnReject) btnReject.disabled = false;
      document.getElementById('sendError').style.display = 'block';
    });
  };
})();
</script>
</body>
</html>
