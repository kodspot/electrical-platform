<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Kodspot Electrical</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f8f9fa;color:#333;text-align:center;padding:2rem}
.offline-card{max-width:360px}
.offline-icon{font-size:3rem;margin-bottom:1rem}
h1{font-size:1.3rem;font-weight:700;margin-bottom:.5rem}
p{color:#555;font-size:.9rem;line-height:1.5;margin-bottom:1.5rem}
.btn{display:block;width:100%;max-width:280px;margin:0 auto;min-height:48px;font:inherit;padding:.6rem 1.5rem;background:#1E40AF;color:#fff;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;text-decoration:none}
.btn:hover{background:#1E3A8A}
</style>
</head>
<body>
<div class="offline-card">
  <div class="offline-icon">📡</div>
  <h1>No internet connection</h1>
  <p>This page will reload by itself when your internet is back.</p>
  <button class="btn" onclick="location.reload()">Try again</button>
</div>
<script>window.addEventListener('online', function() { location.reload(); });</script>
</body>
</html>
