<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<meta name="theme-color" content="#1E40AF">
<title>Reset Password — Kodspot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css?v=10">
<style>
.reset-done { display: none; background: var(--success-bg); color: var(--success-text); border-radius: var(--radius-sm); padding: .85rem 1rem; font-size: .88rem; margin-bottom: var(--sp-md); }
.reset-done.show { display: block; }
.reset-done a { color: var(--success-text); font-weight: 700; }
</style>
</head>
<body class="auth-layout">
<div class="auth-card">
  <h1 class="auth-title">Kodspot</h1>
  <p class="auth-subtitle" id="subtitle">Choose a new password</p>
  <div id="error" class="error-msg" role="alert" data-testid="reset-error"></div>
  <div id="done" class="reset-done" role="status" data-testid="reset-done"></div>

  <!-- Opened without a link (from "Forgot password?" on a sign-in page): ask for the link. -->
  <form id="requestForm" novalidate style="display:none">
    <p class="form-hint" style="margin-bottom:var(--sp-md)">Enter the email you sign in with. We'll send a link to choose a new password.</p>
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" type="email" id="email" required maxlength="200" autocomplete="email">
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="requestBtn">Send reset link</button>
  </form>

  <form id="resetForm" novalidate>
    <div class="form-group">
      <label class="form-label" for="newPassword">New password</label>
      <input class="form-input" type="password" id="newPassword" required minlength="8" maxlength="100" autocomplete="new-password">
      <div class="form-hint">At least 8 characters, with an uppercase letter, a lowercase letter and a number.</div>
    </div>
    <div class="form-group">
      <label class="form-label" for="confirmPassword">Confirm new password</label>
      <input class="form-input" type="password" id="confirmPassword" required minlength="8" maxlength="100" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="btn">Set new password</button>
  </form>

  <p style="margin-top:var(--sp-lg);font-size:.8rem;color:var(--text-light);text-align:center">
    <a href="/" style="color:var(--primary)">&larr; Back to Home</a>
  </p>
</div>

<script src="/js/reset-password.js?v=2"></script>
</body>
</html>
