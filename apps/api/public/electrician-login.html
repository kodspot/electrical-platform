<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1E40AF">
<title>Electrician Login — Kodspot</title>
<link rel="preload" href="/css/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/design-system.css?v=12">
<style>
.pin-note{font-size:.8rem;color:var(--text-muted);margin-top:.25rem}
</style>
</head>
<body class="auth-layout">
<div class="auth-card">
  <h1 class="auth-title" id="brandTitle">Kodspot</h1>
  <p class="auth-subtitle" id="brandSub">Electrician Login</p>
  <div id="error" class="error-msg" role="alert"></div>

  <form id="loginForm">
    <div class="form-group">
      <label class="form-label" for="employeeId">Employee ID</label>
      <input class="form-input" type="text" id="employeeId" required maxlength="50" placeholder="e.g. EMP-001" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="idHint">
      <div class="pin-note" id="idHint">Type it exactly as your admin gave it, capitals included.</div>
    </div>
    <div class="form-group">
      <label class="form-label" for="pin">6-digit PIN</label>
      <input class="form-input" type="password" id="pin" required minlength="6" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="current-password">
      <div class="pin-note">Use the PIN created by your Admin.</div>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn">Sign in as Electrician</button>
  </form>
  <p style="margin-top:var(--sp-md);font-size:.85rem;text-align:center">
    <a id="forgotLink" href="/worker-reset-pin" style="color:var(--primary-text);text-decoration:underline;display:inline-flex;align-items:center;min-height:44px;font-size:.875rem">Forgot PIN?</a>
  </p>

  <p style="margin-top:var(--sp-lg);font-size:.8rem;color:var(--text-light);text-align:center">
    <a id="backLink" href="/" style="color:var(--primary-text);display:inline-flex;align-items:center;min-height:44px">&larr; Back to Home</a>
  </p>
</div>

<script src="/js/offline-sync.js?v=1"></script>
<script src="/js/kit.js?v=1"></script>
<script src="/js/app.js?v=18"></script>
<script>
var $ = App.$;
var orgSlug = App.getOrgSlug();
var mod = App.getModule();
// "Forgot PIN?" asks for a PIN reset link in this organization. [BUG-0051]
if (orgSlug) $('forgotLink').href = '/worker-reset-pin?org=' + encodeURIComponent(orgSlug);
if (orgSlug) { $('backLink').href = '/' + orgSlug + '/' + mod + '/'; $('backLink').textContent = '← Choose a different role'; }
Kit.revealToggle($('pin'));

App.initModulePWA();

function showErr(msg, fields) {
  $('error').textContent = msg; $('error').style.display = 'block';
  (fields || []).forEach(function(id) { $(id).setAttribute('aria-invalid', 'true'); });
}
function hideErr() {
  $('error').style.display = 'none';
  document.querySelectorAll('[aria-invalid]').forEach(function(el) { el.removeAttribute('aria-invalid'); });
}

if (orgSlug) {
  fetch('/api/org/' + encodeURIComponent(orgSlug)).then(function(r) { return r.ok ? r.json() : null; }).then(function(org) {
    if (org && org.name) {
      $('brandTitle').textContent = org.name;
      $('brandSub').innerHTML = 'Electrician Login <span style="display:block;margin-top:.3rem;font-size:var(--fs-xs);color:var(--text-light)">Powered by Kodspot</span>';
      document.title = 'Electrician Login — ' + org.name;
      localStorage.setItem('orgName', org.name);
    }
  }).catch(function() {});
}

$('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault(); hideErr();
  var pin = $('pin').value.trim();
  if (!/^\d{6}$/.test(pin)) { showErr('PIN must be exactly 6 digits'); return; }

  var btn = $('btn'); btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    var res = await fetch('/api/auth/worker-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        orgSlug: orgSlug || localStorage.getItem('orgSlug') || '',
        employeeId: $('employeeId').value.trim(),
        pin: pin
      })
    });
    var data = await res.json().catch(function() { return {}; });
    if (!res.ok) {
      showErr(Kit.signInError(res.status, 'pin', data.error), ['employeeId', 'pin']);
      $('pin').value = '';
      $('pin').focus();
      return;
    }

    localStorage.setItem('elec_token', data.token);
    localStorage.setItem('elec_user', JSON.stringify(data.worker || {}));
    if (orgSlug) localStorage.setItem('orgSlug', orgSlug);
    if (data.org && data.org.name) localStorage.setItem('orgName', data.org.name);
    if (data.org && data.org.enabledModules) localStorage.setItem('enabledModules', JSON.stringify(data.org.enabledModules));
    localStorage.setItem('activeModule', mod);

    location.href = App.orgPath('electrician-scan');
  } catch (err) {
    showErr(Kit.friendlyError(err));
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in as Electrician';
  }
});

if (localStorage.getItem('elec_token')) location.href = App.orgPath('electrician-scan');
</script>
<footer class="auth-footer">
  <a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a>
</footer>
</body>
</html>
