<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<meta name="theme-color" content="#1E40AF">
<title>Reset PIN — Kodspot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css?v=10">
<style>
.reset-done { display: none; background: var(--success-bg); color: var(--success-text); border-radius: var(--radius-sm); padding: .85rem 1rem; font-size: .88rem; margin-bottom: var(--sp-md); }
.reset-done.show { display: block; }
.reset-done a { color: var(--success-text); font-weight: 700; }
</style>
</head>
<body class="auth-layout">
<div class="auth-card">
  <h1 class="auth-title">Kodspot</h1>
  <p class="auth-subtitle">Electrician — choose a new PIN</p>
  <div id="error" class="error-msg" role="alert" data-testid="reset-error"></div>
  <div id="done" class="reset-done" role="status" data-testid="reset-done"></div>

  <form id="resetForm" novalidate>
    <div class="form-group">
      <label class="form-label" for="newPin">New PIN (6 digits)</label>
      <input class="form-input" type="password" id="newPin" required minlength="6" maxlength="6" inputmode="numeric" pattern="\d{6}" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label class="form-label" for="confirmPin">Confirm new PIN</label>
      <input class="form-input" type="password" id="confirmPin" required minlength="6" maxlength="6" inputmode="numeric" pattern="\d{6}" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="btn">Set new PIN</button>
  </form>

  <p style="margin-top:var(--sp-lg);font-size:.8rem;color:var(--text-light);text-align:center">
    <a href="/" style="color:var(--primary)">&larr; Back to Home</a>
  </p>
</div>

<script src="/js/worker-reset-pin.js?v=1"></script>
</body>
</html>
