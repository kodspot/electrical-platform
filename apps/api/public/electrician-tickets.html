<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1E40AF">
<title>Electrician Tickets — Kodspot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css?v=11">
<style>
.el-shell{max-width:760px;margin:0 auto;padding:1rem .8rem 2rem}
.el-toolbar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.8rem}
.el-toolbar h1{font-size:1.125rem;font-weight:700;margin:0}
.el-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.9rem}
.el-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.55rem .45rem;text-align:center}
.el-stat b{display:block;font-size:1.2rem;line-height:1.1}
.el-stat span{font-size:var(--fs-xs);color:var(--text-muted)}
.el-list{display:flex;flex-direction:column;gap:.55rem}
.el-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.8rem .9rem}
.el-top{display:flex;justify-content:space-between;gap:.7rem;align-items:flex-start}
.el-title{font-size:1rem;font-weight:700;line-height:1.35}
.el-badges{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.el-meta{display:flex;flex-wrap:wrap;gap:.35rem .8rem;color:var(--text-muted);font-size:.8rem;margin-top:.35rem}
.el-desc{margin-top:.45rem;font-size:.875rem;color:var(--text)}
.el-actions{margin-top:.65rem;display:flex;gap:.5rem;flex-wrap:wrap}
.el-actions .btn{flex:1;min-height:48px;font-size:.95rem}
.el-note{font-size:.875rem;font-weight:600;color:var(--text-muted)}
.el-empty{text-align:center;color:var(--text-muted);padding:2rem 1rem}
.el-timer{font-size:var(--fs-xs);font-weight:700;padding:.12rem .4rem;border-radius:6px;background:var(--danger-bg);color:var(--danger-text);font-variant-numeric:tabular-nums}
.el-timer.warn{background:var(--warning-bg);color:var(--warning-text)}
.el-timer.ok{background:var(--info-bg);color:var(--info-text)}
.el-img{margin-top:.55rem;width:100%;max-height:180px;object-fit:contain;border-radius:8px;border:1px solid var(--border)}
.el-locbar{display:none;align-items:center;justify-content:space-between;gap:.5rem;background:var(--info-bg);color:var(--info-text);border-radius:var(--radius);padding:.5rem .75rem;margin-bottom:.7rem;font-size:.875rem;font-weight:600}
.el-locbar.show{display:flex}
.filter-tabs{display:flex;gap:.3rem;margin-bottom:.7rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-tab{flex:0 0 auto;min-height:44px;padding:.4rem .75rem;font-size:.85rem;font-weight:600;border-radius:var(--radius);border:1px solid var(--border-control);background:var(--surface);color:var(--text-muted);cursor:pointer}
.filter-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
@media(max-width:640px){.el-stats{display:none}}
</style>
<script>try{if(localStorage.getItem('kodspot_theme')==='light')document.documentElement.removeAttribute('data-theme')}catch(e){}</script>
</head>
<body>
<nav class="topbar">
  <div class="topbar-left">
    <span class="topbar-brand">Kodspot</span>
    <div class="sv-nav" id="sv-nav">
      <a href="/electrician-scan" class="sv-nav-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7V5a2 2 0 012-2h2"/><path d="M17 3h2a2 2 0 012 2v2"/><path d="M21 17v2a2 2 0 01-2 2h-2"/><path d="M7 21H5a2 2 0 01-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>Scan</a>
      <a href="/electrician-tickets" class="sv-nav-link active" aria-current="page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5H9a2 2 0 00-2 2v10a2 2 0 002 2h6a2 2 0 002-2V7a2 2 0 00-2-2z"/><path d="M12 11h.01"/><path d="M12 15h.01"/></svg>Tickets</a>
      <a href="/electrician-my-work" class="sv-nav-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>My Work</a>
    </div>
  </div>
  <div class="topbar-right">
    <span class="topbar-user" id="userName"></span>
    <button class="btn btn-sm btn-ghost" onclick="App.logoutElec()">Logout</button>
  </div>
</nav>

<main class="el-shell">
  <div class="el-toolbar">
    <h1>Electrician Work Queue</h1>
    <button class="btn btn-sm btn-refresh" onclick="loadTickets()">Refresh</button>
  </div>

  <div class="el-stats">
    <div class="el-stat"><b id="sPool" style="color:var(--warning-text)">–</b><span>New jobs</span></div>
    <div class="el-stat"><b id="sActive">–</b><span>My jobs</span></div>
    <div class="el-stat"><b id="sVerify" style="color:var(--primary-text)">–</b><span>Waiting for check</span></div>
    <div class="el-stat"><b id="sDone" style="color:var(--success-text)">–</b><span>Done</span></div>
  </div>

  <div class="el-locbar" id="locBar"><span id="locBarText"></span><a id="locBarAll" href="">Show all</a></div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab" data-tab="pool" onclick="setTab('pool')">New jobs <span id="tabPoolCount">–</span></button>
    <button class="filter-tab" data-tab="active" onclick="setTab('active')">My jobs <span id="tabActiveCount">–</span></button>
    <button class="filter-tab" data-tab="verify" onclick="setTab('verify')">Waiting for check <span id="tabVerifyCount">–</span></button>
    <button class="filter-tab" data-tab="done" onclick="setTab('done')">Done <span id="tabDoneCount">–</span></button>
  </div>

  <div id="ticketList" class="el-list"></div>
</main>

<div class="modal-overlay" id="resolveModal">
  <div class="modal" style="max-width:520px">
    <h2 class="modal-title">Resolve Ticket</h2>
    <div id="resolveError" class="error-msg"></div>
    <form id="resolveForm" enctype="multipart/form-data">
      <input type="hidden" id="rTicketId">
      <div class="form-group">
        <label class="form-label" for="rNote">What did you fix? (optional)</label>
        <textarea class="form-textarea" id="rNote" rows="3" maxlength="1000" placeholder="For example: replaced the switch"></textarea>
      </div>
      <div class="form-group">
        <div class="form-label">Proof photo (required)</div>
        <!-- The global rule hides file inputs, so the label is the control. Without it there was
             no way to attach the photo that resolving requires. [BUG-0062] -->
        <div class="resolve-photo-area" id="rPhotoArea">
          <input class="sr-only" type="file" id="rPhoto" accept="image/jpeg,image/png,image/webp" capture="environment" required>
          <label class="resolve-photo-label" for="rPhoto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg><span id="rPhotoText">Take proof photo</span></label>
          <img class="resolve-preview" id="rPhotoPreview" alt="Your proof photo" hidden>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="App.closeModal('resolveModal')">Cancel</button>
        <button type="submit" class="btn btn-success" id="resolveBtn" disabled>Add proof photo first</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/offline-sync.js?v=1"></script>
<script src="/js/kit.js?v=1"></script>
<script src="/js/app.js?v=17"></script>
<script>
if (!App.initElectrician()) throw '';
App.initNotifications(App.elecFetch, 'electrician');
var $ = App.$, esc = App.esc;
var tickets = [];
var poolTickets = [];
var currentTab = 'pool';
var pageQuery = new URLSearchParams(location.search);
var locationFilter = pageQuery.get('locationId') || null;
var viewOnly = pageQuery.get('view') === '1'; // from a scan outside this electrician's area
var poolFailed = false;
var firstLoad = true;

if (locationFilter) {
  $('locBarText').textContent = 'Showing tickets for ' + (pageQuery.get('name') || 'this location');
  $('locBarAll').href = location.pathname;
  $('locBar').classList.add('show');
}

async function loadTickets() {
  var list = $('ticketList');
  App.showSkeletonCards(list, 3);
  // Fetch in parallel: assigned-coverage tickets + pool
  var mod = (App.getModule && App.getModule()) || localStorage.getItem('activeModule') || 'ele';
  var qs = '&module=' + encodeURIComponent(mod);
  if (locationFilter) qs += '&locationId=' + encodeURIComponent(locationFilter);
  var [resTk, resPool] = await Promise.all([
    App.elecFetch('/worker/tickets?status=OPEN,ACKNOWLEDGED,ASSIGNED,IN_PROGRESS,ON_HOLD,RESOLVED_PENDING_VERIFY,RESOLVED,CANCELLED,CLOSED&limit=100' + qs),
    App.elecFetch('/worker/tickets/pool?module=' + encodeURIComponent(mod))
  ]);
  if (!resTk || !resTk.ok) {
    App.loadFailed(list, { what: 'your tickets', onRetry: loadTickets });
    return;
  }
  var data = await resTk.json();
  tickets = (data.tickets || []).filter(function(t) {
    return !locationFilter || t.locationId === locationFilter;
  });
  poolFailed = !(resPool && resPool.ok);
  if (!poolFailed) {
    var p = await resPool.json();
    poolTickets = (p.tickets || []).filter(function(t) {
      return !locationFilter || t.locationId === locationFilter;
    });
  }
  renderStats();
  // Open on the work in hand, not on the shared list
  if (firstLoad) {
    firstLoad = false;
    if (rowsFor('active').length) return setTab('active');
    if (locationFilter && !poolTickets.length) {
      var tab = ['verify', 'done'].filter(function(x) { return rowsFor(x).length; })[0];
      if (tab) return setTab(tab);
    }
  }
  renderList();
}

// The tab counts and the lists come from the same rows, so they cannot disagree.
function rowsFor(tab) {
  if (tab === 'pool') return poolTickets.slice();
  if (tab === 'active') return tickets.filter(function(t) { return isOpenLikeStatus(t.status) || isActiveLikeStatus(t.status); });
  if (tab === 'verify') return tickets.filter(function(t) { return t.status === 'RESOLVED_PENDING_VERIFY'; });
  return tickets.filter(function(t) { return t.status === 'RESOLVED' || t.status === 'CANCELLED' || t.status === 'CLOSED'; });
}

function renderStats() {
  var set = function(id, n) { $(id).textContent = n; };
  var pool = poolFailed ? '–' : poolTickets.length;
  set('sPool', pool); set('tabPoolCount', pool);
  set('sActive', rowsFor('active').length); set('tabActiveCount', rowsFor('active').length);
  set('sVerify', rowsFor('verify').length); set('tabVerifyCount', rowsFor('verify').length);
  set('sDone', rowsFor('done').length); set('tabDoneCount', rowsFor('done').length);
}

function isOpenLikeStatus(status) {
  return status === 'OPEN' || status === 'ACKNOWLEDGED' || status === 'ASSIGNED';
}

function isActiveLikeStatus(status) {
  return status === 'IN_PROGRESS' || status === 'ON_HOLD';
}

function setTab(t) {
  currentTab = t;
  var btns = document.querySelectorAll('.filter-tab');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === t);
  renderList();
}
// initialize active tab
document.querySelector('.filter-tab[data-tab="pool"]').classList.add('active');

function elapsedLabel(dateStr) {
  var ms = Date.now() - new Date(dateStr).getTime();
  var mins = Math.floor(ms / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return mins + 'm';
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ' + (mins % 60) + 'm';
  return Math.floor(hrs / 24) + 'd';
}

function timerClass(dateStr) {
  var hrs = (Date.now() - new Date(dateStr).getTime()) / 3600000;
  if (hrs >= 4) return 'el-timer';
  if (hrs >= 1) return 'el-timer warn';
  return 'el-timer ok';
}

function renderList() {
  var list = $('ticketList');
  if (currentTab === 'pool' && poolFailed) {
    App.loadFailed(list, { what: 'new jobs', onRetry: loadTickets });
    return;
  }
  var rows = rowsFor(currentTab);

  if (!rows.length) {
    var msg = locationFilter ? 'No tickets at this location.' :
              currentTab === 'pool' ? 'No new jobs in your area right now.' :
              currentTab === 'active' ? 'You have no jobs in hand. Pick one from New jobs to start.' :
              currentTab === 'verify' ? 'Nothing is waiting for your supervisor to check.' :
              'No finished jobs here yet.';
    list.innerHTML = '<div class="el-empty">' + msg + '</div>';
    return;
  }

  rows.sort(function(a, b) {
    var p = { URGENT: 4, HIGH: 3, NORMAL: 2, LOW: 1 };
    var pa = p[a.priority] || 1, pb = p[b.priority] || 1;
    if (pa !== pb) return pb - pa;
    return new Date(b.createdAt) - new Date(a.createdAt);
  });

  list.innerHTML = rows.map(function(t) {
    var canResolve = !viewOnly && isActiveLikeStatus(t.status);
    var canPickup = !viewOnly && (currentTab === 'pool' || (isOpenLikeStatus(t.status) && !isMine(t)));
    var isPendingVerify = t.status === 'RESOLVED_PENDING_VERIFY';
    var isActive = isOpenLikeStatus(t.status) || isActiveLikeStatus(t.status);
    var timerHtml = isActive ? '<span class="' + timerClass(t.createdAt) + '">' + elapsedLabel(t.createdAt) + '</span>' : '';
    return '<article class="el-card">' +
      '<div class="el-top">' +
        '<div><div class="el-title">' + esc(t.title) + '</div></div>' +
        '<div class="el-badges">' +
          timerHtml +
          (t.priority === 'NORMAL' ? '' : App.priorityBadge(t.priority)) +
          App.statusBadge(t.status) +
        '</div>' +
      '</div>' +
      '<div class="el-meta">' +
        '<span>' + esc(t.location ? t.location.name : '—') + '</span>' +
        '<span>' + esc(App.fmtDate(t.createdAt)) + '</span>' +
      '</div>' +
      (t.description ? '<div class="el-desc">' + esc(t.description) + '</div>' : '') +
      (t.imageUrl ? '<img class="el-img" src="' + esc(App.imgUrl(t.imageUrl)) + '" alt="Ticket photo" loading="lazy">' : '') +
      (t.resolvedImageUrl ? '<img class="el-img" src="' + esc(App.imgUrl(t.resolvedImageUrl)) + '" alt="Resolved proof" loading="lazy">' : '') +
      '<div class="el-actions">' +
        (canPickup ? '<button class="btn btn-primary" onclick="pickupTicket(\'' + t.id + '\', this)">Pick Up</button>' : '') +
        (canResolve ? '<button class="btn btn-success" onclick="openResolve(\'' + t.id + '\')">Resolve With Photo</button>' : '') +
        (isPendingVerify ? '<span class="el-note">Awaiting supervisor verification</span>' : '') +
        (viewOnly && !isPendingVerify ? '<span class="el-note">Outside your area: view only</span>' :
          !canPickup && !canResolve && !isPendingVerify ? '<span class="el-note">Done</span>' : '') +
      '</div>' +
    '</article>';
  }).join('');
}

function isMine(t) {
  if (!t.resolvedWorkers) return false;
  var me = (App.getElecUser && App.getElecUser()) || {};
  return t.resolvedWorkers.some(function(w) { return w.id === me.id; });
}

async function pickupTicket(id, btn) {
  if (!(await App.confirmDialog('Pick up this ticket and start work?', { yes: 'Pick up', danger: false }))) return;
  btn.disabled = true; btn.textContent = 'Picking up…';
  var res = await App.elecFetch('/worker/tickets/' + encodeURIComponent(id) + '/pickup', { method: 'POST' });
  if (!res || !res.ok) {
    btn.disabled = false; btn.textContent = 'Pick Up';
    if (res) {
      var d = await res.json().catch(function(){ return {}; });
      App.toast(d.error || 'Could not pick up this ticket. Try again.', 'error');
    }
    return;
  }
  App.toast('Picked up. It is now in My jobs.', 'success');
  setTab('active');
  loadTickets();
}

function photoChosen() {
  var file = $('rPhoto').files[0];
  var preview = $('rPhotoPreview');
  if (preview.src) { URL.revokeObjectURL(preview.src); preview.removeAttribute('src'); }
  preview.hidden = !file;
  if (file) preview.src = URL.createObjectURL(file);
  $('rPhotoArea').classList.toggle('has-photo', !!file);
  $('rPhotoText').textContent = file ? 'Retake photo' : 'Take proof photo';
  $('resolveBtn').disabled = !file;
  $('resolveBtn').textContent = file ? 'Mark Resolved' : 'Add proof photo first';
}
$('rPhoto').addEventListener('change', photoChosen);

function openResolve(id) {
  $('resolveForm').reset();
  photoChosen();
  $('rTicketId').value = id;
  App.hideError('resolveError');
  App.openModal('resolveModal');
}

$('resolveForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var id = $('rTicketId').value;
  var original = $('rPhoto').files[0];
  if (!original) { App.showError('resolveError', 'Take a proof photo first.'); return; }

  var btn = $('resolveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    var file = await Kit.shrinkPhoto(original);
    if (file.size > 5 * 1024 * 1024) {
      App.showError('resolveError', 'This photo is too big. Take it again closer up, or lower your camera quality.');
      return;
    }
    var fd = new FormData();
    fd.append('image', file);
    if ($('rNote').value.trim()) fd.append('note', $('rNote').value.trim());
    var res = await App.elecFetch('/worker/tickets/' + encodeURIComponent(id) + '/resolve', { method: 'POST', body: fd });
    if (!res) {
      App.showError('resolveError', 'No connection. Your photo is still here. Try again.');
      return;
    }
    if (!res.ok) {
      var d = await res.json().catch(function(){ return {}; });
      App.showError('resolveError', d.error || 'Could not save. Your details are still here. Try again.');
      return;
    }
    App.closeModal('resolveModal');
    App.toast('Sent to your supervisor to check.', 'success');
    setTab('verify');
    loadTickets();
  } finally {
    btn.disabled = false; btn.textContent = 'Mark Resolved';
  }
});

loadTickets();
</script>
</body>
</html>
