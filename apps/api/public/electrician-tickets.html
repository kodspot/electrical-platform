<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1E40AF">
<title>Electrician Tickets — Kodspot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css?v=10">
<style>
.el-shell{max-width:760px;margin:0 auto;padding:1rem .8rem 2rem}
.el-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.el-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.9rem}
.el-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.55rem .45rem;text-align:center}
.el-stat b{display:block;font-size:1.2rem;line-height:1.1}
.el-stat span{font-size:.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.el-list{display:flex;flex-direction:column;gap:.55rem}
.el-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.8rem .9rem}
.el-top{display:flex;justify-content:space-between;gap:.7rem;align-items:flex-start}
.el-title{font-size:.9rem;font-weight:700;line-height:1.35}
.el-meta{display:flex;flex-wrap:wrap;gap:.35rem .8rem;color:var(--text-muted);font-size:.74rem;margin-top:.35rem}
.el-desc{margin-top:.45rem;font-size:.8rem;color:var(--text)}
.el-actions{margin-top:.65rem;display:flex;gap:.4rem;flex-wrap:wrap}
.el-empty{text-align:center;color:var(--text-muted);padding:2rem 1rem}
.el-pri{font-size:.62rem;font-weight:700;padding:.14rem .4rem;border-radius:6px;text-transform:uppercase;letter-spacing:.03em}
.el-pri.URGENT{background:rgba(239,68,68,.15);color:#ef4444}
.el-pri.HIGH{background:rgba(249,115,22,.16);color:#fb923c}
.el-pri.NORMAL{background:rgba(59,130,246,.16);color:#60a5fa}
.el-pri.LOW{background:rgba(148,163,184,.16);color:#94a3b8}
.el-status{font-size:.62rem;font-weight:700;padding:.14rem .4rem;border-radius:6px;letter-spacing:.03em}
.el-status.OPEN{background:rgba(220,38,38,.13);color:#ef4444}
.el-status.ACKNOWLEDGED,.el-status.ASSIGNED{background:rgba(249,115,22,.14);color:#fb923c}
.el-status.IN_PROGRESS{background:rgba(245,158,11,.14);color:#f59e0b}
.el-status.ON_HOLD{background:rgba(168,85,247,.14);color:#c084fc}
.el-status.RESOLVED_PENDING_VERIFY{background:rgba(168,85,247,.14);color:#c084fc}
.el-status.RESOLVED,.el-status.CLOSED{background:rgba(16,185,129,.15);color:#34d399}
.el-status.CANCELLED{background:rgba(107,114,128,.18);color:#9ca3af}
.el-timer{font-size:.68rem;font-weight:700;padding:.12rem .4rem;border-radius:6px;background:rgba(239,68,68,.1);color:#ef4444;font-variant-numeric:tabular-nums}
.el-timer.warn{background:rgba(249,115,22,.1);color:#fb923c}
.el-timer.ok{background:rgba(59,130,246,.1);color:#60a5fa}
.el-img{margin-top:.55rem;width:100%;max-height:180px;object-fit:contain;border-radius:8px;border:1px solid var(--border)}
@media(max-width:640px){.el-stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<nav class="topbar">
  <div class="topbar-left">
    <span class="topbar-brand">Kodspot</span>
    <div class="sv-nav" id="sv-nav">
      <a href="/electrician-scan" class="sv-nav-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 012-2h2"/><path d="M17 3h2a2 2 0 012 2v2"/><path d="M21 17v2a2 2 0 01-2 2h-2"/><path d="M7 21H5a2 2 0 01-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>Scan</a>
      <a href="/electrician-tickets" class="sv-nav-link active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5H9a2 2 0 00-2 2v10a2 2 0 002 2h6a2 2 0 002-2V7a2 2 0 00-2-2z"/><path d="M12 11h.01"/><path d="M12 15h.01"/></svg>Tickets</a>
      <a href="/electrician-my-work" class="sv-nav-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>My Work</a>
    </div>
  </div>
  <div class="topbar-right">
    <span class="topbar-user" id="userName"></span>
    <button class="btn btn-sm btn-ghost" onclick="App.logoutElec()">Logout</button>
  </div>
</nav>

<main class="el-shell">
  <div class="el-toolbar">
    <h2 style="font-size:1.05rem;font-weight:700;margin:0">Electrician Work Queue</h2>
    <button class="btn btn-sm btn-outline" onclick="loadTickets()">Refresh</button>
  </div>

  <div class="el-stats">
    <div class="el-stat"><b id="sPool" style="color:#fb923c">0</b><span>Pool</span></div>
    <div class="el-stat"><b id="sActive">0</b><span>My Active</span></div>
    <div class="el-stat"><b id="sVerify" style="color:#c084fc">0</b><span>To Verify</span></div>
    <div class="el-stat"><b id="sDone" style="color:#34d399">0</b><span>Resolved</span></div>
  </div>

  <div class="filter-tabs" id="filterTabs" style="display:flex;gap:.3rem;margin-bottom:.7rem;overflow-x:auto;-webkit-overflow-scrolling:touch">
    <button class="filter-tab" data-tab="pool" onclick="setTab('pool')" style="flex:0 0 auto;padding:.4rem .75rem;font-size:.78rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-weight:600">🔥 Pool <span id="tabPoolCount" style="opacity:.7">0</span></button>
    <button class="filter-tab" data-tab="active" onclick="setTab('active')" style="flex:0 0 auto;padding:.4rem .75rem;font-size:.78rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-weight:600">🛠 Active</button>
    <button class="filter-tab" data-tab="verify" onclick="setTab('verify')" style="flex:0 0 auto;padding:.4rem .75rem;font-size:.78rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-weight:600">⏳ To Verify</button>
    <button class="filter-tab" data-tab="done" onclick="setTab('done')" style="flex:0 0 auto;padding:.4rem .75rem;font-size:.78rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-weight:600">✓ Done</button>
  </div>
  <style>.filter-tab.active{background:var(--primary)!important;color:#fff!important;border-color:var(--primary)!important}</style>

  <div id="ticketList" class="el-list"></div>
</main>

<div class="modal-overlay" id="resolveModal">
  <div class="modal" style="max-width:520px">
    <h2 class="modal-title">Resolve Ticket</h2>
    <div id="resolveError" class="error-msg"></div>
    <form id="resolveForm" enctype="multipart/form-data">
      <input type="hidden" id="rTicketId">
      <div class="form-group">
        <label class="form-label">Resolution Note</label>
        <textarea class="form-textarea" id="rNote" rows="3" maxlength="1000" placeholder="What was fixed?"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Proof Photo *</label>
        <input class="form-input" type="file" id="rPhoto" accept="image/jpeg,image/png,image/webp" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="App.closeModal('resolveModal')">Cancel</button>
        <button type="submit" class="btn btn-success" id="resolveBtn">Mark Resolved</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/offline-sync.js?v=1"></script>
<script src="/js/app.js?v=16"></script>
<script>
if (!App.initElectrician()) throw '';
App.initNotifications(App.elecFetch, 'electrician');
var $ = App.$, esc = App.esc;
var tickets = [];
var poolTickets = [];
var currentTab = 'pool';
var locationFilter = new URLSearchParams(location.search).get('locationId') || null;

async function loadTickets() {
  var list = $('ticketList');
  App.showSkeletonCards(list, 3);
  // Fetch in parallel: assigned-coverage tickets + pool
  var mod = (App.getModule && App.getModule()) || localStorage.getItem('activeModule') || 'ele';
  var qs = '&module=' + encodeURIComponent(mod);
  if (locationFilter) qs += '&locationId=' + encodeURIComponent(locationFilter);
  var [resTk, resPool] = await Promise.all([
    App.elecFetch('/worker/tickets?status=OPEN,ACKNOWLEDGED,ASSIGNED,IN_PROGRESS,ON_HOLD,RESOLVED_PENDING_VERIFY,RESOLVED,CANCELLED,CLOSED&limit=100' + qs),
    App.elecFetch('/worker/tickets/pool?module=' + encodeURIComponent(mod))
  ]);
  if (!resTk || !resTk.ok) {
    list.innerHTML = '<div class="el-empty">Failed to load tickets</div>';
    return;
  }
  var data = await resTk.json();
  tickets = (data.tickets || []).filter(function(t) {
    return !locationFilter || t.locationId === locationFilter;
  });
  if (resPool && resPool.ok) {
    var p = await resPool.json();
    poolTickets = (p.tickets || []).filter(function(t) {
      return !locationFilter || t.locationId === locationFilter;
    });
  }
  renderStats(data.stats || {});
  renderList();
}

function renderStats(stats) {
  $('sPool').textContent = poolTickets.length;
  $('tabPoolCount').textContent = poolTickets.length;
  $('sActive').textContent = (stats.IN_PROGRESS || 0) + (stats.ON_HOLD || 0);
  $('sVerify').textContent = stats.RESOLVED_PENDING_VERIFY || 0;
  $('sDone').textContent = (stats.RESOLVED || 0) + (stats.CANCELLED || 0) + (stats.CLOSED || 0);
}

function isOpenLikeStatus(status) {
  return status === 'OPEN' || status === 'ACKNOWLEDGED' || status === 'ASSIGNED';
}

function isActiveLikeStatus(status) {
  return status === 'IN_PROGRESS' || status === 'ON_HOLD';
}

function setTab(t) {
  currentTab = t;
  var btns = document.querySelectorAll('.filter-tab');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === t);
  renderList();
}
// initialize active tab
document.querySelector('.filter-tab[data-tab="pool"]').classList.add('active');

function elapsedLabel(dateStr) {
  var ms = Date.now() - new Date(dateStr).getTime();
  var mins = Math.floor(ms / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return mins + 'm';
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ' + (mins % 60) + 'm';
  return Math.floor(hrs / 24) + 'd';
}

function timerClass(dateStr) {
  var hrs = (Date.now() - new Date(dateStr).getTime()) / 3600000;
  if (hrs >= 4) return 'el-timer';
  if (hrs >= 1) return 'el-timer warn';
  return 'el-timer ok';
}

function renderList() {
  var list = $('ticketList');
  var rows;
  if (currentTab === 'pool') {
    rows = poolTickets.slice();
  } else if (currentTab === 'active') {
    rows = tickets.filter(function(t) { return isOpenLikeStatus(t.status) || isActiveLikeStatus(t.status); });
  } else if (currentTab === 'verify') {
    rows = tickets.filter(function(t) { return t.status === 'RESOLVED_PENDING_VERIFY'; });
  } else {
    rows = tickets.filter(function(t) { return t.status === 'RESOLVED' || t.status === 'CANCELLED' || t.status === 'CLOSED'; });
  }

  if (!rows.length) {
    var msg = currentTab === 'pool' ? 'No unassigned tickets in your coverage right now.' :
              currentTab === 'active' ? 'No active tickets. Pick one from the Pool to start.' :
              currentTab === 'verify' ? 'Nothing awaiting supervisor verification.' :
              'No resolved tickets here.';
    list.innerHTML = '<div class="el-empty">' + msg + '</div>';
    return;
  }

  rows.sort(function(a, b) {
    var p = { URGENT: 4, HIGH: 3, NORMAL: 2, LOW: 1 };
    var pa = p[a.priority] || 1, pb = p[b.priority] || 1;
    if (pa !== pb) return pb - pa;
    return new Date(b.createdAt) - new Date(a.createdAt);
  });

  list.innerHTML = rows.map(function(t) {
    var canResolve = isActiveLikeStatus(t.status);
    var canPickup = currentTab === 'pool' || (isOpenLikeStatus(t.status) && !isMine(t));
    var isPendingVerify = t.status === 'RESOLVED_PENDING_VERIFY';
    var isActive = isOpenLikeStatus(t.status) || isActiveLikeStatus(t.status);
    var timerHtml = isActive ? '<span class="' + timerClass(t.createdAt) + '">' + elapsedLabel(t.createdAt) + '</span>' : '';
    return '<article class="el-card">' +
      '<div class="el-top">' +
        '<div><div class="el-title">' + esc(t.title) + '</div></div>' +
        '<div style="display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end;align-items:center">' +
          timerHtml +
          '<span class="el-pri ' + esc(t.priority) + '">' + esc(t.priority) + '</span>' +
          '<span class="el-status ' + esc(t.status) + '">' + esc(t.status.replace(/_/g, ' ')) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="el-meta">' +
        '<span>📍 ' + esc(t.location ? t.location.name : '—') + '</span>' +
        '<span>🕒 ' + esc(App.fmtDate(t.createdAt)) + '</span>' +
      '</div>' +
      (t.description ? '<div class="el-desc">' + esc(t.description) + '</div>' : '') +
      (t.imageUrl ? '<img class="el-img" src="' + esc(App.imgUrl(t.imageUrl)) + '" alt="Ticket photo" loading="lazy">' : '') +
      (t.resolvedImageUrl ? '<img class="el-img" src="' + esc(App.imgUrl(t.resolvedImageUrl)) + '" alt="Resolved proof" loading="lazy">' : '') +
      '<div class="el-actions">' +
        (canPickup ? '<button class="btn btn-sm btn-primary" onclick="pickupTicket(\'' + t.id + '\')">⚡ Pick Up</button>' : '') +
        (canResolve ? '<button class="btn btn-sm btn-success" onclick="openResolve(\'' + t.id + '\')">📷 Resolve With Photo</button>' : '') +
        (isPendingVerify ? '<span style="font-size:.75rem;color:#c084fc;font-weight:600">⚡ Awaiting supervisor verification</span>' : '') +
        (!canPickup && !canResolve && !isPendingVerify ? '<span style="font-size:.75rem;color:var(--text-muted)">✓ Done</span>' : '') +
      '</div>' +
    '</article>';
  }).join('');
}

function isMine(t) {
  if (!t.resolvedWorkers) return false;
  var me = (App.getElecUser && App.getElecUser()) || {};
  return t.resolvedWorkers.some(function(w) { return w.id === me.id; });
}

async function pickupTicket(id) {
  if (!confirm('Pick up this ticket and start work?')) return;
  var res = await App.elecFetch('/worker/tickets/' + encodeURIComponent(id) + '/pickup', { method: 'POST' });
  if (!res) return;
  if (!res.ok) {
    var d = await res.json().catch(function(){ return {}; });
    App.toast(d.error || 'Failed to pick up ticket', 'error');
    return;
  }
  App.toast('Ticket picked up — switched to Active', 'success');
  setTab('active');
  loadTickets();
}

function openResolve(id) {
  $('resolveForm').reset();
  $('rTicketId').value = id;
  App.hideError('resolveError');
  App.openModal('resolveModal');
}

$('resolveForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var id = $('rTicketId').value;
  var fd = new FormData();
  var file = $('rPhoto').files[0];
  if (!file) { App.showError('resolveError', 'Please attach a proof photo.'); return; }
  fd.append('image', file);
  if ($('rNote').value.trim()) fd.append('note', $('rNote').value.trim());

  var btn = $('resolveBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  var res = await App.elecFetch('/worker/tickets/' + encodeURIComponent(id) + '/resolve', { method: 'POST', body: fd });
  btn.disabled = false; btn.textContent = 'Mark Resolved';
  if (!res) return;
  if (!res.ok) {
    var d = await res.json().catch(function(){ return {}; });
    App.showError('resolveError', d.error || 'Failed to resolve ticket');
    return;
  }
  App.closeModal('resolveModal');
  App.toast('Ticket resolved successfully', 'success');
  loadTickets();
});

loadTickets();
</script>
</body>
</html>
