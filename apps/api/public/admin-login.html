<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1E40AF">
<title>Admin Login — Kodspot</title>
<link rel="preload" href="/css/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/design-system.css?v=12">
</head>
<body class="auth-layout">
<div class="auth-card">
  <h1 class="auth-title" id="brandTitle">Kodspot</h1>
  <p class="auth-subtitle" id="brandSub">Admin — Sign in to manage your facility</p>
  <div id="error" class="error-msg" role="alert"></div>

  <form id="loginForm">
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" type="email" id="email" required autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" type="password" id="password" required autocomplete="current-password">
    </div>
    <div id="orgSelect" style="display:none" class="form-group">
      <label class="form-label" for="orgId">Select Organization</label>
      <select class="form-select" id="orgId"></select>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn">Sign in as Admin</button>
  </form>
  <p style="margin-top:var(--sp-md);font-size:.85rem;text-align:center">
    <a id="forgotLink" href="/reset-password" style="color:var(--primary-text);text-decoration:underline;display:inline-flex;align-items:center;min-height:44px;font-size:.875rem">Forgot password?</a>
  </p>

  <p style="margin-top:var(--sp-lg);font-size:.8rem;color:var(--text-light);text-align:center">
    <a id="backLink" href="/" style="color:var(--primary-text);display:inline-flex;align-items:center;min-height:44px">&larr; Back to Home</a>
  </p>
</div>

<script src="/js/offline-sync.js?v=1"></script>
<script src="/js/kit.js?v=1"></script>
<script src="/js/app.js?v=18"></script>
<script src="/js/custom-select.js?v=2"></script>
<script>
var $ = App.$;
var orgSlug = App.getOrgSlug();
var mod = App.getModule();
// "Forgot password?" asks for a reset link for this organization's account. [BUG-0051]
if (orgSlug) $('forgotLink').href = '/reset-password?org=' + encodeURIComponent(orgSlug);
if (orgSlug) { $('backLink').href = '/' + orgSlug + '/' + mod + '/'; $('backLink').textContent = '← Choose a different role'; }
Kit.revealToggle($('password'));

// Set dynamic manifest for this module
App.initModulePWA();

// Show org branding if accessed via org URL
if (orgSlug) {
  fetch('/api/org/' + encodeURIComponent(orgSlug)).then(function(r) { return r.ok ? r.json() : null; }).then(function(org) {
    if (org && org.name) {
      $('brandTitle').textContent = org.name;
      $('brandSub').innerHTML = 'Admin Login <span style="display:block;margin-top:.3rem;font-size:var(--fs-xs);color:var(--text-light)">Powered by Kodspot</span>';
      document.title = 'Admin Login — ' + org.name;
      localStorage.setItem('orgName', org.name);
    }
  }).catch(function() {});
}

function showErr(msg, fields) {
  $('error').textContent = msg; $('error').style.display = 'block';
  (fields || []).forEach(function(id) { $(id).setAttribute('aria-invalid', 'true'); });
}
function hideErr() {
  $('error').style.display = 'none';
  document.querySelectorAll('[aria-invalid]').forEach(function(el) { el.removeAttribute('aria-invalid'); });
}

$('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault(); hideErr();
  var btn = $('btn'); btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    var body = { email: $('email').value, password: $('password').value };
    var orgId = $('orgId').value;
    if (orgId) body.orgId = orgId;
    if (orgSlug) body.orgSlug = orgSlug;
    var res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var data = await res.json().catch(function() { return {}; });
    if (res.status === 400 && data.organizations) {
      $('orgSelect').style.display = 'block';
      var sel = $('orgId');
      sel.innerHTML = data.organizations.map(function(o) { return '<option value="' + o.orgId + '">' + o.role + ' — ' + o.orgId.slice(0, 8) + '</option>'; }).join('');
      showErr('Multiple accounts found. Select an organization.');
      return;
    }
    if (!res.ok) { showErr(Kit.signInError(res.status, 'password', data.error), ['email', 'password']); return; }
    if (!data.token || !data.user) { showErr('Invalid server response'); return; }
    if (data.user.role !== 'ADMIN') {
      showErr('This login is for organization admins only.'); return;
    }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    localStorage.setItem('activeModule', mod);
    if (data.user.enabledModules) localStorage.setItem('enabledModules', JSON.stringify(data.user.enabledModules));
    var slug = data.user.orgSlug || orgSlug;
    if (slug) localStorage.setItem('orgSlug', slug);
    if (data.user.orgName) localStorage.setItem('orgName', data.user.orgName);
    location.href = App.orgPath('admin-dashboard');
  } catch (err) { showErr(Kit.friendlyError(err)); }
  finally { btn.disabled = false; btn.textContent = 'Sign in as Admin'; }
});

// Redirect if already logged in as ADMIN
if (localStorage.getItem('token')) {
  var u = JSON.parse(localStorage.getItem('user') || '{}');
  if (u.role === 'ADMIN') location.href = App.orgPath('admin-dashboard');
}
</script>
<footer class="auth-footer">
  <a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a>
</footer>
</body>
</html>
