<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1E40AF">
<title>Print QR Codes — Kodspot</title>
<link rel="preload" href="/css/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/design-system.css?v=12">
<style>
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.5rem;padding:1rem 0}
.qr-item{text-align:center;page-break-inside:avoid;break-inside:avoid;border:1px solid var(--border);border-radius:var(--radius);padding:1rem;background:var(--surface)}
.qr-item svg,.qr-item img{width:160px;height:160px;margin:0 auto .5rem}
.qr-label{font-size:.8rem;font-weight:600;color:var(--text)}
.qr-type{font-size:var(--fs-xs);color:var(--text-muted)}
.print-bar{position:sticky;top:56px;background:var(--bg);padding:.75rem 0;z-index:10;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);margin-bottom:1rem}
@media print{
  .topbar,.sa-banner,.print-bar{display:none!important}
  body{background:#fff}
  .qr-grid{grid-template-columns:repeat(3,1fr);gap:1rem}
  .qr-item{border:1px solid #ccc;padding:.5rem}
  .qr-item svg,.qr-item img{width:120px;height:120px}
}
</style>
</head>
<body>
<nav class="topbar">
  <div class="topbar-left">
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
    <span class="topbar-brand">Kodspot</span>
    <div class="topbar-nav" id="topbar-nav"></div>
  </div>
  <div class="topbar-right">
    <span class="topbar-user" id="userName"></span>
    <button class="btn btn-sm btn-ghost" onclick="App.logout()">Logout</button>
  </div>
</nav>
<div class="sa-banner" id="sa-banner"></div>

<main class="container">
  <h1 class="sr-only">Print QR codes</h1>
  <div class="print-bar">
    <span id="countLabel" aria-live="polite" style="font-size:.9rem;color:var(--text-muted)">Loading QR codes…</span>
    <button class="btn btn-outline" id="retryBtn" onclick="retryFailed()" hidden>Try again</button>
    <button class="btn btn-primary" id="printBtn" onclick="printAll()" disabled style="display:inline-flex;align-items:center;gap:.35rem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print All</button>
  </div>
  <div id="qrGrid" class="qr-grid"></div>
</main>

<script src="/js/offline-sync.js?v=1"></script>
<script src="/js/app.js?v=18"></script>
<script>
// If localStorage is empty, wait for session transfer from opener
(function() {
  var _booted = false;
  function safeBoot() { if (!_booted) { _booted = true; boot(); } }

  if (localStorage.getItem('token') || localStorage.getItem('sa_token')) { safeBoot(); return; }
  // Listen for session data via postMessage from parent window
  function onMessage(e) {
    if (e.origin !== location.origin) return;
    if (e.data && e.data.type === 'session-transfer' && e.data.data) {
      var d = e.data.data;
      for (var k in d) { if (d.hasOwnProperty(k)) localStorage.setItem(k, d[k]); }
      window.removeEventListener('message', onMessage);
      safeBoot();
    }
  }
  window.addEventListener('message', onMessage);
  // Timeout: if no message received in 5s, redirect to login
  setTimeout(function() {
    if (!localStorage.getItem('token') && !localStorage.getItem('sa_token')) {
      window.removeEventListener('message', onMessage);
      location.href = App.orgPath('admin-login');
    }
  }, 5000);
})();

function boot() {
  if (!App.initAdmin('locations')) return;
  App.initNotifications(App.apiFetch);
  loadQRCodes();
}

var esc = App.esc, $ = App.$;

var total = 0, failed = [];

async function loadQRCodes() {
  var res = await App.apiFetch('/locations/tree?active=true');
  if (!res || !res.ok) {
    $('countLabel').textContent = '';
    App.loadFailed($('qrGrid'), { what: 'the locations', onRetry: loadQRCodes });
    return;
  }
  var tree = await res.json();

  var locations = [];
  var CONTAINER_TYPES = ['BUILDING', 'FLOOR', 'HOSTEL', 'SUBSTATION', 'PANEL_ROOM', 'GENERATOR_ROOM', 'TRANSFORMER', 'UTILITY_AREA'];
  function flatten(nodes, prefix) {
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (CONTAINER_TYPES.indexOf(n.type) === -1) {
        locations.push({ id: n.id, name: n.name, fullName: prefix + n.name, type: n.type, qrCode: n.qrCode });
      }
      if (n.children && n.children.length) flatten(n.children, prefix + n.name + ' → ');
    }
  }
  if (Array.isArray(tree)) flatten(tree, '');

  if (!locations.length) {
    $('countLabel').textContent = '';
    App.emptyState($('qrGrid'), {
      title: 'No rooms to print yet',
      body: 'Stickers are made for rooms and other spaces, not for blocks or floors. Add rooms in Locations.',
      actionLabel: 'Go to Locations',
      onAction: function() { location.href = App.orgPath('admin-locations'); }
    });
    return;
  }
  total = locations.length;
  $('qrGrid').innerHTML = '';
  await prepare(locations);
}

function qrItem(loc, svg) {
  var div = document.createElement('div');
  div.className = 'qr-item';
  div.id = 'qr-' + loc.id;
  div.innerHTML = (svg || '<div style="width:160px;height:160px;background:#f1f5f9;border-radius:8px;margin:0 auto .5rem;display:flex;align-items:center;justify-content:center;color:#475569;font-size:.8rem">Could not load</div>') +
    '<div class="qr-label">' + esc(loc.fullName || loc.name) + '</div>' +
    (loc.qrCode ? '<div style="font-family:monospace;font-size:.8rem;color:#1E3A8A;font-weight:700;letter-spacing:.5px;margin-top:.2rem">Code: ' + esc(loc.qrCode) + '</div>' : '') +
    '<div style="font-size:10pt;color:#334155;margin-top:.4rem;line-height:1.3;border-top:1px dashed #cbd5e1;padding-top:.35rem"><b>Problem here? Scan to report it.</b><br>Staff: scan to inspect.</div>';
  return div;
}

// Batch fetch QR codes in groups of 5. Printing is held back until every sticker is on the page:
// printing during the load gave a partial set with nothing to say so. [BUG-0068]
async function prepare(list) {
  $('printBtn').disabled = true;
  $('retryBtn').hidden = true;
  failed = [];
  var BATCH = 5;
  for (var b = 0; b < list.length; b += BATCH) {
    $('countLabel').textContent = 'Preparing ' + Math.min(b + BATCH, list.length) + ' of ' + list.length + ' stickers…';
    var results = await Promise.all(list.slice(b, b + BATCH).map(function(loc) {
      return App.apiFetch('/locations/' + loc.id + '/qr-image').then(function(r) {
        if (r && r.ok) return r.text().then(function(svg) { return { loc: loc, svg: svg }; });
        return { loc: loc, svg: null };
      }).catch(function() { return { loc: loc, svg: null }; });
    }));
    results.forEach(function(r) {
      if (!r.svg) failed.push(r.loc);
      var item = qrItem(r.loc, r.svg), old = $('qr-' + r.loc.id);
      if (old) old.replaceWith(item); else $('qrGrid').appendChild(item);
    });
  }
  $('countLabel').textContent = failed.length
    ? failed.length + ' QR code' + (failed.length === 1 ? '' : 's') + ' could not load.'
    : 'Ready: ' + total + ' sticker' + (total === 1 ? '' : 's');
  $('retryBtn').hidden = !failed.length;
  $('printBtn').disabled = false;
}

function retryFailed() { prepare(failed.slice()); }

async function printAll() {
  if (failed.length && !(await App.confirmDialog(failed.length + ' sticker' + (failed.length === 1 ? ' is' : 's are') + ' missing. Print the rest anyway?', { yes: 'Print anyway', danger: false }))) return;
  window.print();
}
</script>
</body>
</html>
