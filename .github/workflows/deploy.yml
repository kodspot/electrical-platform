name: Deploy to Production

on:
  push:
    branches:
      - main
  # Every PR, into any branch (including stacked PRs), runs the test gate. Only the
  # test job runs for a PR: the deploy job below is gated on a push to main.
  pull_request:

jobs:
  # Test gate: every push and every PR against main must pass lint + the full test
  # suite (including the database-backed integration tests, run here against a real
  # disposable Postgres service container) before a production deploy is even
  # considered. The deploy job below depends on this one.
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: electrical_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d electrical_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/electrical_ci
      # CI-only placeholder secrets — deliberately not the real production secrets
      # (least-privilege: a test run has no business holding production credentials).
      # DATA_ENCRYPTION_KEY must be valid-format (64 hex chars) for the app to boot;
      # it's never used to protect real data here.
      # Must meet the boot-time minimum length (JWT/COOKIE >= 32, ADMIN >= 16; see
      # src/config/env.js). The previous JWT placeholder was 30 chars and failed the
      # app's own startup validation.
      JWT_SECRET: ci-only-placeholder-jwt-secret-000000
      COOKIE_SECRET: ci-only-placeholder-cookie-secret
      ADMIN_KEY: ci-only-placeholder-admin-key
      DATA_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      R2_ACCOUNT_ID: ci-placeholder
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      R2_BUCKET_NAME: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Apply database migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      # The single, comprehensive validation gate (npm run ci): lint + the full test
      # suite (which includes the scenario platform and the bug regression library) +
      # repository/package/environment/migration/generated-doc safety checks. The deploy
      # job below only runs if this passes. See docs — this is the same `npm run ci` a
      # developer runs locally, so CI and local validation can never diverge.
      - name: CI validation
        working-directory: apps/api
        run: npm run ci

      # Sends the already-scrubbed run summary to the super-admin Quality dashboard
      # (POST /api/qa/runs). Best-effort: it never fails the job, skips when the secrets or
      # the summary file are absent, and prints only the HTTP status — never the URL or
      # token (this repository's logs are public).
      - name: Report test results to the Quality dashboard
        if: always()
        continue-on-error: true
        working-directory: apps/api
        env:
          QA_INGEST_URL: ${{ secrets.QA_INGEST_URL }}
          QA_INGEST_TOKEN: ${{ secrets.QA_INGEST_TOKEN }}
          QA_SOURCE: ci
          QA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_REF: ${{ github.head_ref || github.ref_name }}
          QA_EVENT: ${{ github.event_name }}
          QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$QA_INGEST_URL" ] || [ -z "$QA_INGEST_TOKEN" ]; then echo "QA ingest not configured; skipping."; exit 0; fi
          if [ ! -f reports/test-summary.json ]; then echo "No reports/test-summary.json; skipping."; exit 0; fi
          node <<'JS'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('reports/test-summary.json', 'utf8'));
          const body = {
            source: process.env.QA_SOURCE, commitSha: process.env.QA_SHA, ref: process.env.QA_REF,
            event: process.env.QA_EVENT, runUrl: process.env.QA_RUN_URL, nodeVersion: process.version, summary
          };
          fetch(process.env.QA_INGEST_URL, {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: 'Bearer ' + process.env.QA_INGEST_TOKEN },
            body: JSON.stringify(body),
            signal: AbortSignal.timeout(15000)
          }).then((r) => console.log('QA ingest HTTP status: ' + r.status))
            .catch((e) => console.log('QA ingest request failed: ' + e.name));
          JS

  deploy:
    name: Deploy to Production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0

        env:
          NODE_ENV: production
          PORT: "3000"
          DOMAIN: kodspot.in

          APP_URL: ${{ secrets.APP_URL }}
          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}

          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

          SES_SMTP_HOST: ${{ secrets.SES_SMTP_HOST }}
          SES_SMTP_USER: ${{ secrets.SES_SMTP_USER }}
          SES_SMTP_PASS: ${{ secrets.SES_SMTP_PASS }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}

          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}

          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}

          GLOBAL_AI_API_KEY: ${{ secrets.GLOBAL_AI_API_KEY }}
          GLOBAL_AI_PROVIDER: ${{ secrets.GLOBAL_AI_PROVIDER }}
          GLOBAL_AI_MODEL: ${{ secrets.GLOBAL_AI_MODEL }}

          GIT_SHA: ${{ github.sha }}
          IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER }}
          QA_INGEST_TOKEN: ${{ secrets.QA_INGEST_TOKEN }}
          GH_ACTIONS_DISPATCH_TOKEN: ${{ secrets.GH_ACTIONS_DISPATCH_TOKEN }}

        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}

          timeout: 30m
          command_timeout: 30m

          envs: NODE_ENV,PORT,DOMAIN,APP_URL,COOKIE_DOMAIN,DATABASE_URL,DB_USER,DB_PASSWORD,DB_NAME,JWT_SECRET,COOKIE_SECRET,ADMIN_KEY,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET_NAME,CORS_ORIGINS,SES_SMTP_HOST,SES_SMTP_USER,SES_SMTP_PASS,SES_FROM_EMAIL,DATA_ENCRYPTION_KEY,ALERT_TELEGRAM_BOT_TOKEN,ALERT_TELEGRAM_CHAT_ID,ALERT_WEBHOOK_URL,GLOBAL_AI_API_KEY,GLOBAL_AI_PROVIDER,GLOBAL_AI_MODEL,GIT_SHA,IP_HASH_PEPPER,QA_INGEST_TOKEN,GH_ACTIONS_DISPATCH_TOKEN

          script: |
            set -e

            cd ~/electrical-platform

            echo "=== PULLING LATEST CODE ==="
            git pull origin main

            echo "=== WRITING ENV FILE ==="

            cat > .env << EOF
            NODE_ENV=${NODE_ENV}
            PORT=${PORT}
            DOMAIN=${DOMAIN}
            APP_URL=${APP_URL}
            COOKIE_DOMAIN=${COOKIE_DOMAIN}
            DATABASE_URL=${DATABASE_URL}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            DB_NAME=${DB_NAME}
            JWT_SECRET=${JWT_SECRET}
            COOKIE_SECRET=${COOKIE_SECRET}
            ADMIN_KEY=${ADMIN_KEY}
            R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
            R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
            R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
            R2_BUCKET_NAME=${R2_BUCKET_NAME}
            CORS_ORIGINS=${CORS_ORIGINS}
            SES_SMTP_HOST=${SES_SMTP_HOST}
            SES_SMTP_USER=${SES_SMTP_USER}
            SES_SMTP_PASS=${SES_SMTP_PASS}
            SES_FROM_EMAIL=${SES_FROM_EMAIL}
            DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
            ALERT_TELEGRAM_BOT_TOKEN=${ALERT_TELEGRAM_BOT_TOKEN}
            ALERT_TELEGRAM_CHAT_ID=${ALERT_TELEGRAM_CHAT_ID}
            ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
            GLOBAL_AI_API_KEY=${GLOBAL_AI_API_KEY}
            GLOBAL_AI_PROVIDER=${GLOBAL_AI_PROVIDER}
            GLOBAL_AI_MODEL=${GLOBAL_AI_MODEL}
            GIT_SHA=${GIT_SHA}
            IP_HASH_PEPPER=${IP_HASH_PEPPER}
            QA_INGEST_TOKEN=${QA_INGEST_TOKEN}
            GH_ACTIONS_DISPATCH_TOKEN=${GH_ACTIONS_DISPATCH_TOKEN}
            EOF

            chmod 600 .env

            # Always clean up before deploy — prevents port conflicts from stale containers
            echo "=== STOPPING OLD CONTAINERS ==="
            docker compose down --remove-orphans

            echo "=== BUILDING NEW IMAGE ==="
            docker compose build

            echo "=== STARTING ALL SERVICES ==="
            docker compose up -d

            echo "=== WAITING FOR API TO BECOME HEALTHY ==="
            for i in $(seq 1 24); do
              if docker compose exec -T api wget -qO- http://127.0.0.1:3000/health/ready > /dev/null 2>&1; then
                echo "✅ API is healthy (after ~${i}0s)"
                break
              fi
              echo "  Attempt $i/24 — not ready yet..."
              sleep 10
              if [ "$i" -eq 24 ]; then
                echo "❌ API HEALTH CHECK TIMED OUT after 240s"
                docker compose logs --tail 150 api
                exit 1
              fi
            done

            echo "✅ API HEALTHY"

            echo "=== CADDY STATUS ==="
            docker compose ps caddy

            echo "=== CADDY LOGS ==="
            docker compose logs --tail 50 caddy

            echo "=== CLEANUP UNUSED IMAGES ==="
            docker image prune -f

            echo "✅ DEPLOYMENT SUCCESSFUL"