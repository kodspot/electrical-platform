name: E2E

# Browser end-to-end, visual and accessibility suite (e2e/, ADR 0006). Separate from
# deploy.yml: it never deploys and holds no production credential.
#   - every PR (the required "e2e" check always exists; it passes in seconds when the PR
#     touches none of apps/api/**, e2e/** or this workflow);
#   - nightly at 21:30 UTC (03:00 IST);
#   - by hand or from the super-admin Quality page ("Run full test suite now"), which
#     dispatches it on main with requested_by=superadmin.
# The suite runs in 3 parallel shards (each with its own disposable database); the job named
# "e2e" merges their reports into ONE report and summary, exactly as a single run produced.
# This repository is public: logs and artifacts are world-readable. The app under test
# runs on a disposable database with per-run generated secrets (playwright.config.js), so
# traces hold no real credential; the ingest token is passed only through env and never
# printed.

on:
  pull_request:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate the Linux visual baselines and upload them as an artifact"
        type: boolean
        default: false
      requested_by:
        description: "Who started this run (the Quality page sends 'superadmin')"
        type: string
        default: "manual"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does this PR touch the app, the suite or this workflow? Schedule and dispatch always run.
  # Any doubt (e.g. git cannot answer) means run.
  changes:
    name: e2e — what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "git diff failed; running the suite"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$files" | grep -qE '^(apps/api/|e2e/|\.github/workflows/e2e\.yml$)'; then run=true; else run=false; fi
          echo "run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  shard:
    name: e2e shard ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: electrical_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d electrical_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      # Loopback + a name ending in _e2e: the only kind of database the suite will touch.
      DATABASE_URL: postgresql://e2e:e2e@127.0.0.1:5432/electrical_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            apps/api/package-lock.json
            e2e/package-lock.json

      - name: Install the app
        working-directory: apps/api
        run: npm ci

      - name: Install the e2e suite
        working-directory: e2e
        run: npm ci

      # The browser download is cached per Playwright version (e2e/package-lock.json); the
      # system libraries it needs are installed either way.
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Chromium
        working-directory: e2e
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run this shard
        working-directory: e2e
        env:
          UPDATE_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots && 'true' || 'false' }}
        run: |
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob --update-snapshots=all
          else
            npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob
          fi

      - name: Upload this shard's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-shard-${{ matrix.shard }}
          path: e2e/blob-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload this shard's traces (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-shard-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Only the baselines this shard wrote or changed; the e2e job lays them over the
      # committed ones, so no shard can overwrite another's with a stale copy.
      - name: Collect this shard's new baselines
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_snapshots
        run: |
          mkdir -p snap-out
          git status --porcelain --untracked-files=all -- e2e/tests/__screenshots__/linux \
            | sed 's/^...//' | while read -r f; do
              rel="${f#e2e/tests/__screenshots__/linux/}"
              mkdir -p "snap-out/$(dirname "$rel")" && cp "$f" "snap-out/$rel"
            done
          find snap-out -name '*.png' | wc -l | sed 's/^/baselines written by this shard: /'

      - name: Upload this shard's new baselines
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_snapshots
        uses: actions/upload-artifact@v7
        with:
          name: snap-shard-${{ matrix.shard }}
          path: snap-out/
          retention-days: 1
          if-no-files-found: ignore

  # The required check. One report and summary for the whole run, as before sharding.
  e2e:
    name: e2e
    needs: [changes, shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Nothing relevant changed
        if: needs.changes.outputs.run != 'true'
        run: echo "This PR touches none of apps/api/**, e2e/** or the e2e workflow; the e2e suite is not needed."

      - name: Checkout
        if: needs.changes.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.changes.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            apps/api/package-lock.json
            e2e/package-lock.json

      # The app's packages: the summary's design section reads the route table.
      - name: Install the app and the e2e suite
        if: needs.changes.outputs.run == 'true'
        run: |
          (cd apps/api && npm ci)
          (cd e2e && npm ci)

      - name: Download the shards' reports
        if: needs.changes.outputs.run == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: blob-shard-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge the reports
        if: needs.changes.outputs.run == 'true'
        working-directory: e2e
        run: npx playwright merge-reports --config merge.config.js ./all-blob-reports

      - name: Summarize
        if: needs.changes.outputs.run == 'true'
        working-directory: e2e
        run: node scripts/summarize.js || echo "No report to summarize."

      # Design ratchet (QA-2): axe colour-contrast nodes over every page and viewport may only
      # go down (e2e/design-baseline.json). Fails only when the count is worse; the colour
      # literal ratchet runs in npm run ci.
      - name: Design ratchet (colour contrast)
        if: needs.changes.outputs.run == 'true' && hashFiles('e2e/reports/e2e-summary.json') != ''
        working-directory: apps/api
        run: node scripts/design-ratchet.js contrast ../../e2e/reports/e2e-summary.json

      - name: Upload the report
        if: always() && needs.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Download the shards' traces
        if: always() && needs.changes.outputs.run == 'true' && needs.shard.result != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: traces-shard-*
          path: e2e/test-results
          merge-multiple: true

      - name: Upload traces (failures only)
        if: always() && needs.changes.outputs.run == 'true' && needs.shard.result != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # The committed baselines with every shard's new or changed ones laid over them.
      - name: Download the shards' new baselines
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_snapshots
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: snap-shard-*
          path: e2e/tests/__screenshots__/linux
          merge-multiple: true

      - name: Upload the Linux visual baselines
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_snapshots
        uses: actions/upload-artifact@v7
        with:
          name: e2e-snapshots-linux
          path: e2e/tests/__screenshots__/linux/
          retention-days: 7
          if-no-files-found: warn

      # Sends the summary to the super-admin Quality page (POST /api/qa/runs, source 'e2e').
      # Best-effort: never fails the job, skips when a secret or the summary is absent, and
      # prints only the HTTP status — never the URL or the token.
      - name: Report results to the Quality dashboard
        if: always() && needs.changes.outputs.run == 'true'
        continue-on-error: true
        working-directory: e2e
        env:
          QA_INGEST_URL: ${{ secrets.QA_INGEST_URL }}
          QA_INGEST_TOKEN: ${{ secrets.QA_INGEST_TOKEN }}
          QA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_REF: ${{ github.head_ref || github.ref_name }}
          QA_EVENT: ${{ github.event_name }}
          QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$QA_INGEST_URL" ] || [ -z "$QA_INGEST_TOKEN" ]; then echo "QA ingest not configured; skipping."; exit 0; fi
          if [ ! -f reports/e2e-summary.json ]; then echo "No reports/e2e-summary.json; skipping."; exit 0; fi
          node <<'JS'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('reports/e2e-summary.json', 'utf8'));
          const body = {
            source: 'e2e', commitSha: process.env.QA_SHA, ref: process.env.QA_REF,
            event: process.env.QA_EVENT, runUrl: process.env.QA_RUN_URL, nodeVersion: process.version, summary
          };
          fetch(process.env.QA_INGEST_URL, {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: 'Bearer ' + process.env.QA_INGEST_TOKEN },
            body: JSON.stringify(body),
            signal: AbortSignal.timeout(15000)
          }).then((r) => console.log('QA ingest HTTP status: ' + r.status))
            .catch((e) => console.log('QA ingest request failed: ' + e.name));
          JS

      # Last, so the reports are uploaded either way: the check is red when a shard failed or
      # was cancelled (or the report could not be merged), green when every shard passed or
      # nothing relevant changed.
      - name: Result
        if: always()
        env:
          RUN: ${{ needs.changes.outputs.run }}
          SHARDS: ${{ needs.shard.result }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then echo "Change detection did not complete ($CHANGES)"; exit 1; fi
          if [ "$RUN" != "true" ]; then echo "e2e not needed for this change: passed"; exit 0; fi
          if [ "$SHARDS" != "success" ]; then echo "At least one shard did not pass ($SHARDS)"; exit 1; fi
          echo "All shards passed"
